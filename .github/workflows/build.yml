name: build-apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v3
        with: {gradle-version: 8.7}
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: StoneAgeWanderer-apk, path: app/build/outputs/apk/debug/app-debug.apk}
      - name: Publish release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk StoneAgeWanderer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StoneAgeWanderer.apk --title "StoneAgeWanderer APK" --notes "Debug APK built from main"
